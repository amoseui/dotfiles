[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Sidebar agent entries: state as text (not just icon color), location,
# and the live terminal title (agents update it with their current task).
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[keys]
# tmux-style: prefix is already ctrl+b (herdr default)
# workspace switching without opening the picker (tmux session-switch feel)
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
switch_workspace = "prefix+shift+1..9"
# tmux muscle memory: prefix+d detaches (herdr default was prefix+q)
detach = "prefix+d"
